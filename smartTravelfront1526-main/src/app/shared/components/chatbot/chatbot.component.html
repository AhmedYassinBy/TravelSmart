<!-- Floating Chat Button -->
<button
  class="chat-toggle-btn"
  (click)="toggleChat()"
  [class.has-unread]="unreadCount > 0"
  aria-label="Open chat"
>
  <span class="chat-icon" *ngIf="!isOpen">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="28"
      height="28"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
      ></path>
    </svg>
  </span>
  <span class="close-icon" *ngIf="isOpen">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="28"
      height="28"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </span>
  <span class="unread-badge" *ngIf="unreadCount > 0 && !isOpen">{{
    unreadCount
  }}</span>
  <span class="pulse-ring"></span>
</button>

<!-- Chat Window -->
<div
  class="chat-window"
  *ngIf="isOpen"
  [@slideInOut]
  [class.minimized]="isMinimized"
>
  <!-- Chat Header -->
  <div class="chat-header">
    <div class="header-left">
      <div class="bot-avatar">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
          <line x1="9" y1="9" x2="9.01" y2="9"></line>
          <line x1="15" y1="9" x2="15.01" y2="9"></line>
        </svg>
      </div>
      <div class="bot-info">
        <h3>TravelSmart AI Assistant</h3>
        <span class="status">
          <span class="status-dot" [class.offline]="!isOnline"></span>
          {{ isOnline ? "Online" : "Offline" }}
        </span>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" (click)="clearChat()" title="Clear chat">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path
            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
          ></path>
        </svg>
      </button>
      <button class="header-btn" (click)="minimizeChat()" title="Minimize">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="header-btn" (click)="closeChat()" title="Close">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Chat Body -->
  <div class="chat-body" #messagesContainer *ngIf="!isMinimized">
    <!-- Welcome Section -->
    <div class="welcome-section" *ngIf="messages.length <= 1">
      <div class="welcome-icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <p class="welcome-text">
        Your AI-powered admin assistant is here to help you manage flights,
        hotels, and bookings!
      </p>
    </div>

    <!-- Messages -->
    <div class="messages-list">
      <div
        *ngFor="let message of messages"
        class="message-wrapper"
        [class.user]="message.sender === 'user'"
        [class.bot]="message.sender === 'bot'"
        [@fadeIn]
      >
        <div class="message-avatar" *ngIf="message.sender === 'bot'">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
            <line x1="9" y1="9" x2="9.01" y2="9"></line>
            <line x1="15" y1="9" x2="15.01" y2="9"></line>
          </svg>
        </div>

        <div class="message-content">
          <div class="message-bubble">
            <p
              [innerHTML]="message.content | slice : 0 : 1000"
              style="white-space: pre-wrap"
            ></p>
          </div>
          <span class="message-time">{{ formatTime(message.timestamp) }}</span>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div class="message-wrapper bot" *ngIf="isTyping" [@fadeIn]>
        <div class="message-avatar">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
            <line x1="9" y1="9" x2="9.01" y2="9"></line>
            <line x1="15" y1="9" x2="15.01" y2="9"></line>
          </svg>
        </div>
        <div class="message-content">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Replies -->
    <div class="quick-replies" *ngIf="messages.length <= 1">
      <button
        *ngFor="let reply of quickReplies"
        class="quick-reply-btn"
        (click)="handleQuickReply(reply)"
        [@bounceIn]
      >
        {{ reply.text }}
      </button>
    </div>
  </div>

  <!-- Chat Footer -->
  <div class="chat-footer" *ngIf="!isMinimized">
    <div class="input-wrapper">
      <input
        type="text"
        #messageInput
        [(ngModel)]="newMessage"
        (keypress)="onKeyPress($event)"
        placeholder="Type your message..."
        class="message-input"
        maxlength="500"
      />
      <button
        class="send-btn"
        (click)="sendMessage()"
        [disabled]="!newMessage.trim()"
        [class.active]="newMessage.trim()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p class="powered-by">Powered by TravelSmart AI</p>
  </div>
</div>
