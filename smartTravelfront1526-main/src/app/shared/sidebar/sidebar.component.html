<div class="fixed top-0 left-0 w-72 h-full bg-slate-900 text-white shadow-2xl z-50 flex flex-col font-sans">

    <!-- Branding Section -->
    <div class="p-6 border-b border-white/10 relative overflow-hidden group">
        <div class="absolute inset-0 bg-gradient-to-r from-blue-600/20 to-cyan-600/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
        </div>
        <div class="relative z-10">
            <h1
                class="text-2xl font-black bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent tracking-tight">
                TravelSmart
            </h1>
            <span class="text-xs font-semibold text-slate-400 tracking-widest uppercase mt-1 block">Admin Portal</span>
        </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 overflow-y-auto py-4 px-3 scrollbar-thin scrollbar-thumb-slate-700 scrollbar-track-transparent">
        
        <!-- Dashboard Link -->
        <div class="mb-4">
            <a [routerLink]="['/admin/dashboard']" routerLinkActive="bg-blue-600/20 text-white"
               class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-all duration-200 cursor-pointer">
                <span class="text-xl">📊</span>
                <span class="font-semibold text-sm">Dashboard</span>
            </a>
        </div>

        <!-- Navigation Sections -->
        <div *ngFor="let section of navSections" class="mb-4">
            <!-- Section Header -->
            <button (click)="toggleSection(section.key)" 
                    class="w-full flex items-center justify-between px-4 py-2 mb-2 rounded-lg hover:bg-white/5 transition-colors group">
                <div class="flex items-center gap-2">
                    <span class="text-sm">{{ section.icon }}</span>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">{{ section.title }}</span>
                    <span *ngIf="section.badge" 
                          class="px-2 py-0.5 text-[10px] font-bold text-white rounded-full"
                          [ngClass]="section.badgeColor">
                        {{ section.badge }}
                    </span>
                </div>
                <span class="text-slate-500 text-xs transition-transform duration-200"
                      [class.rotate-180]="isSectionExpanded(section.key)">
                    ▼
                </span>
            </button>

            <!-- Section Items -->
            <ul *ngIf="isSectionExpanded(section.key)" 
                class="space-y-1 ml-2 border-l-2 border-slate-700/50 pl-2 animate-slideDown">
                <li *ngFor="let item of section.items">
                    <a [routerLink]="item.route"
                       [queryParams]="item.queryParams"
                       routerLinkActive="bg-blue-600/20 text-white border-l-2 border-blue-400 -ml-[10px] pl-[18px]"
                       class="flex items-center gap-3 px-4 py-2.5 rounded-r-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all duration-200 cursor-pointer text-sm font-medium">
                        <span class="text-base">{{ item.icon }}</span>
                        <span>{{ item.label }}</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Settings Section -->
        <div class="mt-auto pt-4 border-t border-slate-800">
            <a [routerLink]="['/admin/settings']" routerLinkActive="bg-blue-600/20 text-white"
               class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all duration-200 cursor-pointer">
                <span class="text-xl">⚙️</span>
                <span class="font-medium text-sm">Settings</span>
            </a>
        </div>
    </nav>

    <!-- User Profile & Settings -->
    <div class="p-4 border-t border-white/5 bg-slate-900/80 backdrop-blur">
        <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition-colors cursor-pointer group">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-cyan-400 p-0.5 shadow-lg shadow-blue-500/20">
                <div
                    class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center text-sm font-bold text-blue-400">
                    ADM
                </div>
            </div>
            <div class="flex-1 min-w-0">
                <div class="text-sm font-bold text-white group-hover:text-blue-400 transition-colors truncate">Admin User</div>
                <div class="text-xs text-slate-500">Administrator</div>
            </div>
            <span class="text-slate-500 group-hover:text-white transition-colors">→</span>
        </div>
    </div>
</div>
