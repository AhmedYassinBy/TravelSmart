<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Smart - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      input::placeholder {
        @apply text-gray-400;
      }
      input:focus {
        @apply outline-none ring-2 ring-red-500 ring-offset-0;
      }
      button {
        @apply transition-all duration-300 ease-in-out;
      }
    </style>
  </head>
  <body class="bg-white">
    <div class="min-h-screen flex">
      <!-- Left side - Form -->
      <div
        class="w-full lg:w-1/2 flex flex-col justify-center items-center bg-white px-6 py-12"
      >
        <div class="w-full max-w-md">
          <!-- Title -->
          <div class="text-center mb-10">
            <h1
              class="text-4xl font-extrabold tracking-tight"
              style="
                font-family: 'Poppins', Inter, system-ui, -apple-system,
                  'Segoe UI', Roboto, 'Helvetica Neue', Arial;
                color: #e11d48;
              "
            >
              TRAVEL
              <span style="color: #111827; margin-left: 6px; font-weight: 700"
                >SMART</span
              >
            </h1>
            <p class="text-gray-600 text-base">
              Login into your account to continue
            </p>
          </div>

          <!-- Form -->
          <form class="space-y-5" (ngSubmit)="login()">
            <!-- Email Input -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                username
              </label>
              <div class="flex">
                <input
                  [(ngModel)]="user.username"
                  name="email"
                  type="email"
                  placeholder="enter your username"
                  class="flex-1 px-4 py-3 border border-gray-300 text-sm bg-gray-50 hover:bg-white transition"
                  required
                />
                <div class="flex items-center justify-center bg-red-600 px-4">
                  <i class="fa-solid fa-envelope text-white text-lg"></i>
                </div>
              </div>
            </div>

            <!-- Password Input -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Password
              </label>
              <div class="flex">
                <input
                  [(ngModel)]="user.password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  class="flex-1 px-4 py-3 border border-gray-300 text-sm bg-gray-50 hover:bg-white transition"
                  required
                />
                <div class="flex items-center justify-center bg-red-600 px-4">
                  <i class="fa-solid fa-lock text-white text-lg"></i>
                </div>
              </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="text-right pt-2">
              <a
                routerLink="/forgot-password"
                class="text-sm font-medium text-red-600 hover:text-red-700 transition"
              >
                Forgot password?
              </a>
            </div>

            <!-- Login Button -->
            <button
              type="submit"
              class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition-all"
            >
              Login Now
            </button>

            <!-- Error Message -->
            <p
              *ngIf="errorMessage"
              class="mt-4 text-center text-sm text-red-600 bg-red-50 py-2 rounded-lg border border-red-200 animate-fadeIn"
            >
              {{ errorMessage }}
            </p>

            <!-- Divider -->
            <div class="flex items-center gap-4 py-4">
              <div class="flex-1 h-px bg-gray-300"></div>
              <div class="flex-1 h-px bg-gray-300"></div>
            </div>
          </form>

          <!-- Footer Text -->
          <p class="text-center text-sm text-gray-600 mt-8">
            By logging in, you agree to our
            <a href="#" class="text-red-600 hover:underline font-medium">
              Terms of Service
            </a>
          </p>
        </div>
      </div>

      <!-- Right side - Illustration -->
      <div
        class="hidden lg:flex w-1/2 items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100 p-8"
      >
        <img
          src="https://thumbs.dreamstime.com/b/bright-travel-suitcases-airplane-hot-air-balloon-globe-stand-ready-grand-adventure-across-world-398948278.jpg"
          alt="Login Illustration"
          class="w-full max-w-2xl object-contain drop-shadow-lg rounded-lg"
        />
      </div>
    </div>

    <!-- Optional animation -->
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-in-out;
      }
    </style>
  </body>
</html>
