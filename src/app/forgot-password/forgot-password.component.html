<!-- src/app/auth/forgot-password/forgot-password.component.html -->
<div class="min-h-screen flex">
  <!-- Left side - Form -->
  <div
    class="w-full lg:w-1/2 flex flex-col justify-center items-center bg-white px-6 py-12"
  >
    <div class="w-full max-w-md">
      <!-- Title -->
      <div class="text-center mb-10">
        <h1
          class="text-4xl font-extrabold tracking-tight"
          style="
            font-family: 'Poppins', Inter, system-ui, -apple-system, 'Segoe UI',
              Roboto, 'Helvetica Neue', Arial;
            color: #e11d48;
          "
        >
          TRAVEL
          <span style="color: #111827; margin-left: 6px; font-weight: 700"
            >SMART</span
          >
        </h1>
        <p class="text-gray-600 text-base">Forgot your password?</p>
        <p class="text-gray-500 text-sm">
          Enter your email to receive a reset link.
        </p>
      </div>

      <!-- Form -->
      <form class="space-y-5" (ngSubmit)="onSubmit()">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"
            >Email Address</label
          >
          <div class="flex">
            <input
              [(ngModel)]="email"
              name="email"
              type="email"
              required
              placeholder="alex@email.com"
              class="flex-1 px-4 py-3 border border-gray-300 text-sm bg-gray-50 hover:bg-white transition"
            />
            <div class="flex items-center justify-center bg-red-600 px-4">
              <i class="fa-solid fa-envelope text-white text-lg"></i>
            </div>
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition-all"
        >
          Send Reset Link
        </button>

        <button
          routerLink="/log"
          type="button"
          class="w-full border-2 border-red-600 text-red-600 font-semibold py-3 rounded-lg hover:bg-red-50 transition-all"
        >
          Back to Login
        </button>
      </form>

      <p *ngIf="message" class="mt-3 text-green-600 text-sm text-center">
        {{ message }}
      </p>
      <p *ngIf="error" class="mt-3 text-red-600 text-sm text-center">
        {{ error }}
      </p>
    </div>
  </div>

  <!-- Right side - Illustration -->
  <div
    class="hidden lg:flex w-1/2 items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100 p-8"
  >
    <img
      src="https://img.freepik.com/premium-vector/password-reset-concept-illustration_86047-960.jpg"
      alt="Forgot Password Illustration"
      class="w-full max-w-2xl object-contain drop-shadow-lg rounded-lg"
    />
  </div>
</div>
